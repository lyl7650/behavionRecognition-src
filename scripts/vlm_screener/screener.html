<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>VLM 審閱 · 篩選 + 編輯</title>
<style>
  :root{
    --bg:#141418; --panel:#1d1d23; --panel2:#24242c; --panel3:#33333f;
    --line:#33333d; --line2:#40404c;
    --tx:#e4e4ea; --tx2:#9a9aa6; --tx3:#8a8a96; --tx4:#63636e;
    --acc:#6ea8fe; --acc-soft:rgba(110,168,254,.15); --acc-line:rgba(110,168,254,.45);
    --ok:#3fb950; --ok-soft:rgba(63,185,80,.14); --amber:#d4b13f;
    --eating:#e8834a; --drinking:#4a9de8; --active:#58b95c;
    --resting:#9a8fc2; --unknown:#d4b13f; --none:#4a4a52;
    --grooming:#e2789f; --others:#8e95a3; --defecating:#a9714b; --stand:#45b0a8;
    --warn:#f0553a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--tx);font:13px/1.5 "Segoe UI",system-ui,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
  :focus-visible{outline:2px solid var(--acc);outline-offset:2px}
  svg{display:block;flex:none}
  .hint{color:var(--tx2);font-size:11px}
  input[type=text]{background:var(--panel2);color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:12px}
  button{background:var(--panel2);color:var(--tx);border:1px solid var(--line);border-radius:7px;padding:4px 12px;font-size:12px;cursor:pointer}
  button:hover:not(:disabled){border-color:var(--acc);color:var(--acc)}
  button.primary{border-color:var(--acc);color:var(--acc);font-weight:600}
  button:disabled{opacity:.45;cursor:default}

  /* ---------- 顶部：身分帶 / 步骤帶 / 篩選帶 ---------- */
  .bar{display:flex;align-items:center;gap:10px;padding:0 14px;height:42px;flex:0 0 auto;border-bottom:1px solid var(--line)}
  .bar--id{background:#17171c}
  .bar--steps{background:var(--panel)}
  .bar--filters{background:#1a1a20}
  .brand{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;white-space:nowrap}
  .pill{display:inline-flex;align-items:center;gap:5px;height:19px;padding:0 8px;border-radius:999px;font-size:11px;border:1px solid transparent;white-space:nowrap}
  .pill i{width:5px;height:5px;border-radius:50%;background:currentColor}
  .pill--live{color:var(--ok);background:var(--ok-soft);border-color:rgba(63,185,80,.32)}
  .pill--view{color:var(--amber);background:rgba(212,177,63,.13);border-color:rgba(212,177,63,.3)}
  .vsep{width:1px;height:18px;background:var(--line);margin:0 2px;flex:none}
  .spacer{flex:1}
  .prog{display:flex;align-items:center;gap:9px;font-size:11.5px;color:var(--tx2);white-space:nowrap}
  .progbar{width:126px;height:4px;border-radius:2px;background:#2b2b35;overflow:hidden;flex:none}
  .progbar i{display:block;height:100%;width:0;background:var(--ok);border-radius:2px;transition:width .3s}
  .kpi b{color:var(--ok);font-weight:600;font-variant-numeric:tabular-nums}

  .step{display:flex;align-items:center;gap:8px;min-width:0}
  .step__n{width:17px;height:17px;border-radius:50%;border:1px solid var(--line2);color:var(--tx3);display:grid;place-items:center;font-size:10px;flex:none}
  .step__n .ck{display:none}
  .step.is-done .step__n{background:var(--acc-soft);border-color:var(--acc-line);color:var(--acc)}
  .step.is-done .step__n b{display:none}
  .step.is-done .step__n .ck{display:block}
  .step__t{font-size:11px;color:var(--tx2);letter-spacing:.04em;white-space:nowrap}
  .step__note{font-size:11.5px;color:var(--amber)}
  .chev{color:#55555f;font-size:13px;flex:none}

  /* ---------- 控件 ---------- */
  .btn{height:26px;padding:0 11px;border-radius:7px;border:1px solid var(--line2);background:var(--panel2);color:var(--tx);font-size:12px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap;text-decoration:none}
  .btn:hover:not(:disabled){border-color:var(--acc);color:var(--acc)}
  .btn--ghost{background:transparent;border-color:transparent;color:var(--tx2)}
  .btn--ghost:hover{background:var(--panel2);border-color:var(--line);color:var(--tx)}
  .btn--deliver{background:var(--acc-soft);border-color:var(--acc-line);color:var(--acc);font-weight:600}
  .btn--deliver:hover:not(:disabled){background:rgba(110,168,254,.24);border-color:var(--acc)}
  .knum{background:rgba(110,168,254,.22);border-radius:999px;font-size:10.5px;padding:1px 6px;font-weight:700}

  .seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:2px;gap:2px;flex:none}
  .seg button{height:22px;padding:0 10px;border:0;background:transparent;color:var(--tx2);font-size:12px;border-radius:5px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .seg button:hover:not(:disabled){color:var(--tx);border-color:transparent}
  .seg button.on{background:var(--panel3);color:#fff;box-shadow:inset 0 0 0 1px var(--line2)}
  .seg button:disabled{opacity:.4;cursor:default}
  .seg .n{font-size:11px;color:var(--tx4);font-variant-numeric:tabular-nums}
  .seg button.on .n{color:var(--acc)}

  .pathfield{display:flex;align-items:center;height:28px;border:1px solid var(--line);border-radius:7px;background:var(--panel2);flex:1 1 300px;min-width:170px;max-width:540px;overflow:hidden}
  .pathfield:hover{border-color:var(--line2)}
  .pathfield__ico{padding:0 7px 0 9px;color:var(--tx3);display:flex;flex:none}
  .pathfield__view{display:none;flex:1;min-width:0;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:text}
  .pathfield__view em{color:var(--tx3);font-style:normal}
  .pathfield__view b{font-weight:600;color:var(--tx)}
  .pathfield:not(.editing) .pathfield__view{display:block}
  .pathfield:not(.editing) #dirInput{display:none}
  .pathfield input{flex:1;min-width:0;background:transparent;border:0;outline:0;font-size:12px;padding:0 2px}
  .pathfield__act{height:100%;padding:0 10px;border:0;border-left:1px solid var(--line);border-radius:0;background:transparent;color:var(--tx2);font-size:11.5px;cursor:pointer;flex:none}
  .pathfield__act:hover{background:var(--panel3);color:var(--acc);border-color:var(--line)}

  .scene{display:flex;align-items:center;gap:5px;height:28px;padding:0 8px;border-radius:7px;border:1px dashed rgba(212,177,63,.5);background:var(--panel2);flex:none}
  .scene .lock{display:none;color:var(--tx3)}
  .scene.is-bound{border-style:solid;border-color:var(--line)}
  .scene.is-bound .lock{display:block}
  .scene input{background:transparent;border:0;outline:0;font-size:12px;min-width:3.5em;padding:0;color:var(--tx)}
  #stepDir{flex:1;min-width:0}
  .scene input::placeholder{color:var(--amber);opacity:.85}

  .cb{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px 0 7px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);font-size:11.5px;color:var(--tx4);cursor:pointer;white-space:nowrap;flex:none}
  .cb .tick{width:10px;height:10px;opacity:0}
  .cb:hover:not(:disabled){border-color:var(--line2);color:var(--tx2)}
  .cb.on{border-color:var(--acc-line);background:var(--acc-soft);color:var(--acc)}
  .cb.on .tick{opacity:1}
  .cb:disabled{opacity:.45;cursor:default}

  .switchwrap{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--tx2);cursor:pointer;white-space:nowrap;user-select:none;flex:none}
  .switchwrap input{display:none}
  .switch{width:26px;height:15px;border-radius:999px;background:#3a3a46;position:relative;transition:background .15s;flex:none}
  .switch::after{content:"";position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;background:#9a9aa6;transition:transform .15s,background .15s}
  .switch.on{background:rgba(110,168,254,.3)}
  .switch.on::after{transform:translateX(11px);background:var(--acc)}
  .switchwrap.is-off{opacity:.42;pointer-events:none}

  .btn--run{height:26px;padding:0 13px;position:relative;overflow:hidden;background:var(--acc);border:1px solid var(--acc);color:#0c1622;font-weight:600;font-size:12px;border-radius:7px;cursor:pointer;display:inline-flex;align-items:center;white-space:nowrap;flex:none}
  .btn--run .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,255,255,.26);transition:width .4s}
  .btn--run>span{position:relative;display:inline-flex;align-items:center;gap:6px}
  .btn--run:hover:not(:disabled){background:#8cbcff;border-color:#8cbcff;color:#0c1622}
  .btn--run.is-run{background:#1a2331;border-color:var(--acc-line);color:var(--acc)}
  .btn--run.is-run .fill{background:rgba(110,168,254,.26)}
  .btn--run:disabled{opacity:1;cursor:default}

  .search{display:flex;align-items:center;gap:6px;height:26px;padding:0 7px;border:1px solid var(--line);border-radius:7px;background:var(--panel2);width:190px;flex:none}
  .search svg{color:var(--tx3)}
  .search input{flex:1;min-width:0;background:transparent;border:0;outline:0;font-size:12px;padding:0}
  .fbtn{position:relative;height:26px;padding:0 9px;border-radius:7px;border:1px solid var(--line);background:var(--panel2);color:var(--tx2);font-size:12px;display:inline-flex;align-items:center;gap:5px;cursor:pointer;white-space:nowrap;flex:none}
  .fbtn:hover{color:var(--tx);border-color:var(--line2)}
  .fbtn.is-on{color:var(--acc);border-color:var(--acc-line);background:var(--acc-soft)}
  .fbtn .cnt{background:var(--acc);color:#0c1622;border-radius:999px;font-size:10px;font-weight:700;padding:0 5px;line-height:14px}
  .fbtn .caret{color:var(--tx4)}
  .res{font-size:11.5px;color:var(--tx2);font-variant-numeric:tabular-nums;white-space:nowrap}
  .res b{color:var(--tx)}
  .popwrap{position:relative;flex:none}
  .pop{position:absolute;top:calc(100% + 5px);left:0;z-index:60;min-width:236px;background:#23232b;border:1px solid var(--line2);border-radius:10px;box-shadow:0 14px 34px rgba(0,0,0,.55);padding:9px}
  .pop--wide{min-width:300px}
  .pop__h{font-size:11px;color:var(--tx3);padding:2px 4px 7px;line-height:1.5}
  .popgrid{display:grid;grid-template-columns:1fr 1fr;gap:2px 6px}
  .popgrid .opt:last-child{grid-column:1 / -1}
  .opt{display:flex;align-items:center;gap:7px;height:25px;padding:0 6px;border-radius:6px;cursor:pointer;font-size:12px;color:var(--tx2)}
  .opt:hover{background:var(--panel3);color:var(--tx)}
  .opt .box{width:13px;height:13px;border-radius:4px;border:1px solid var(--line2);display:grid;place-items:center;flex:none;color:#0c1622}
  .opt .box svg{opacity:0}
  .opt.on{color:var(--tx)}
  .opt.on .box{background:var(--acc);border-color:var(--acc)}
  .opt.on .box svg{opacity:1}
  .poprow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 4px;font-size:12px;color:var(--tx2)}
  .poprow select{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:2px 6px;font-size:12px;color:var(--tx)}
  .poprow input[type=range]{width:120px}

  .statusbar{height:26px;flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:0 14px;border-top:1px solid var(--line);background:#17171c;font-size:11.5px;color:var(--tx2)}
  .sdot{width:6px;height:6px;border-radius:50%;background:var(--ok);flex:none}
  .statusbar.warn .sdot{background:var(--amber)}
  .statusbar.err .sdot{background:var(--warn)}
  .statusbar.busy .sdot{background:var(--acc);animation:pulse 1.1s infinite}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  .statusbar .msg{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .statusbar .keys{margin-left:auto;display:flex;gap:9px;align-items:center;color:var(--tx4);white-space:nowrap}
  select{background:var(--panel2);color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:3px 6px;font-size:12px}
  input[type=range]{padding:0;width:140px;accent-color:var(--acc)}
  .main{flex:1;display:flex;min-height:0}
  .list{width:430px;border-right:1px solid var(--line);overflow-y:auto;padding:8px}
  .card{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:8px;margin-bottom:8px;cursor:pointer;display:flex;gap:10px}
  .card:hover{border-color:var(--acc)}
  .card.sel{border-color:var(--acc);background:var(--panel2)}
  .card img{width:96px;height:60px;object-fit:cover;border-radius:6px;background:#000;flex-shrink:0}
.card .thumb{width:96px;height:60px;border-radius:6px;background:repeating-linear-gradient(45deg,#20202a,#20202a 6px,#26262f 6px,#26262f 12px);flex-shrink:0}
.pager{display:flex;align-items:center;gap:8px;padding:10px 4px;color:var(--tx2);font-size:12px}
.pager button{background:var(--panel2);color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:3px 10px;cursor:pointer;font-size:13px}
.pager button:disabled{opacity:.35;cursor:default}
.pager input{width:64px;background:var(--panel2);color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:2px 6px;font-size:12px}
  .card .info{flex:1;min-width:0}
  .card .nm{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .meta{color:var(--tx2);font-size:11px;display:flex;gap:8px;margin:2px 0 5px;align-items:center;flex-wrap:wrap}
  .badge{padding:0 7px;border-radius:9px;font-size:10px;background:var(--panel2)}
  .badge.st-pending{background:#3a3a44;color:#b9b9c4}
  .badge.st-ready{background:#1e3a5c;color:#8ec2f7}
  .badge.st-approved{background:#1d4028;color:#7fd0a0}
  .csq{font-size:10px;padding:1px 5px;border-radius:4px;color:#111;font-weight:600;white-space:nowrap;overflow:hidden}
  .detail{flex:1;overflow-y:auto;padding:14px 18px}
  .detail h2{font-size:14px;font-weight:600;margin-bottom:4px;word-break:break-all}
  .detail .sub{color:var(--tx2);font-size:12px;margin-bottom:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .detail video{width:100%;max-height:42vh;border-radius:10px;background:#000}
  .tl{margin-top:12px}
  .tl .tl-name{font-size:12px;color:var(--tx2);margin-bottom:3px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
  .tl .band{position:relative;height:26px;border-radius:6px;background:var(--panel2);overflow:hidden;border:1px solid var(--line)}
  .tl .segro{position:absolute;top:0;height:100%}
  .tl .segro span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;color:rgba(0,0,0,.75);font-weight:600;overflow:hidden;white-space:nowrap}
  #etl{position:relative;height:44px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);margin-top:4px;user-select:none}
  #etl .seg{position:absolute;top:5px;bottom:5px;border-radius:6px;cursor:pointer;overflow:hidden;font-size:11px;font-weight:600;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;min-width:5px}
  #etl .seg.selected{outline:2px solid #fff;outline-offset:1px;z-index:3}
  #etl .handle{position:absolute;top:0;bottom:0;width:9px;cursor:ew-resize}
  #etl .handle.l{left:0}#etl .handle.r{right:0}
  #etl .seg:hover .handle::after{content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:2px;height:46%;background:rgba(0,0,0,.5);border-radius:1px}
  #ecursor{position:absolute;top:-2px;bottom:-2px;width:2px;background:#fff;pointer-events:none;box-shadow:0 0 8px rgba(255,255,255,.7);z-index:4}
  #legend{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
  .lchip{display:inline-flex;align-items:center;padding:3px 12px;border-radius:14px;font-size:12px;font-weight:600;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6);cursor:pointer;opacity:.62}
  .lchip:hover{opacity:.9}
  .lchip.active{opacity:1;outline:2px solid #fff;outline-offset:1px}
  .lchip.gap{background:#666;cursor:default;opacity:.8}
  table{width:100%;border-collapse:collapse;margin-top:14px;font-size:12px}
  th,td{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left}
  th{color:var(--tx2);font-weight:400;position:sticky;top:0;background:var(--bg)}
  .dom{display:inline-block;padding:0 8px;border-radius:8px;color:#111;font-weight:600;font-size:11px}
  .empty{color:var(--tx2);text-align:center;padding:40px 0}
  .sw{width:10px;height:10px;border-radius:3px;display:inline-block;vertical-align:-1px;margin-right:4px}
  #editStatus{font-size:12px;color:var(--acc)}
  .statscard{margin-top:16px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .statscard .row{display:grid;grid-template-columns:78px 1fr 70px;gap:12px;align-items:center;margin:6px 0}
  .statscard .track{position:relative;height:12px;background:var(--panel2);border-radius:6px;overflow:hidden}
  .statscard .fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px;min-width:2px}
  .statscard .head{font-size:11px;color:var(--tx2);letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px}
  kbd{font-family:Consolas,monospace;font-size:11px;background:var(--panel2);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px}
</style>
</head>
<body>
<header class="bar bar--id">
  <div class="brand">
    <svg width="18" height="18" viewBox="0 0 18 18"><rect width="18" height="18" rx="5" fill="#6ea8fe"/><rect x="4.5" y="5" width="9" height="2" rx="1" fill="#0c1622"/><rect x="4.5" y="8.5" width="5.5" height="2" rx="1" fill="#0c1622" opacity=".62"/><rect x="4.5" y="12" width="7.5" height="1.6" rx=".8" fill="#0c1622" opacity=".38"/></svg>
    VLM 審閱
  </div>
  <span class="pill pill--live" id="modePill"><i></i><span id="modeText">推理模式</span></span>
  <span class="vsep"></span>
  <div class="prog">
    <div class="progbar" title="已批准 / 全部影片"><i id="progFill"></i></div>
    <span class="kpi" id="progTxt"><b>0</b> / 0 已批准</span>
  </div>
  <span class="spacer"></span>
  <a id="exportBtn" class="btn btn--ghost" href="/api/export">
    <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2v8m0 0L5 7m3 3l3-3M3 12.5h10"/></svg>匯出 jsonl</a>
  <button id="finishBtn" class="btn btn--deliver" title="寫入 review_state.json 快照，並把已批准片段裁剪到資料集">
    <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 3.5h7M6 8h7M6 12.5h7M2.8 3.5h.01M2.8 8h.01M2.8 12.5h.01"/></svg>完成並裁剪<span class="knum" id="finishNum">0</span></button>
</header>

<div class="bar bar--steps">
  <div class="step is-done" id="stepSpecies">
    <span class="step__n"><b>1</b><svg class="ck" width="9" height="9" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1.5 5.4L4 7.9 8.6 2.4"/></svg></span>
    <span class="step__t">物種</span>
    <div class="seg" id="speciesSeg">
      <button data-sp="rabbit" class="on">兔子</button>
      <button data-sp="pet">貓 / 狗</button>
    </div>
  </div>
  <span class="chev">›</span>
  <div class="step" id="stepDir">
    <span class="step__n"><b>2</b><svg class="ck" width="9" height="9" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1.5 5.4L4 7.9 8.6 2.4"/></svg></span>
    <span class="step__t">目錄</span>
    <div class="pathfield editing" id="pathfield">
      <span class="pathfield__ico">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M1.8 4.2h4l1.3 1.6h7.1v6.4a1 1 0 01-1 1H2.8a1 1 0 01-1-1V4.2z"/></svg>
      </span>
      <input type="text" id="dirInput" spellcheck="false" autocomplete="off" placeholder="貼上影片目錄路徑，Enter 載入">
      <span class="pathfield__view" id="pathView" title="點一下可貼上／修改路徑"><em>尚未開啟目錄</em></span>
      <button class="pathfield__act" id="browseBtn" title="彈出系統資料夾選擇框，直接返回絕對路徑">選擇…</button>
    </div>
    <label class="scene" id="sceneChip" title="片段導出到 場地-record 目錄；純審閱可留空">
      <svg class="lock" width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3.2" y="7" width="9.6" height="6.6" rx="1.4"/><path d="M5.6 7V5.2a2.4 2.4 0 014.8 0V7"/></svg>
      <input type="text" id="sceneInput" list="sceneList" placeholder="場地" spellcheck="false" size="4">
    </label>
    <datalist id="sceneList"></datalist>
  </div>
  <span class="chev">›</span>
  <div class="step" id="stepInfer">
    <span class="step__n"><b>3</b><svg class="ck" width="9" height="9" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1.5 5.4L4 7.9 8.6 2.4"/></svg></span>
    <span class="step__t">推理</span>
    <span id="inferCombos" style="display:flex;gap:4px"></span>
    <label class="switchwrap" id="cropWrap" title="推理畫面：預設全畫面；勾選後按 YOLO bbox 外擴 1.25 裁剪，漏檢幀回退全畫面">
      <span class="switch" id="cropSw"></span>按框裁切
      <input type="checkbox" id="cropChk">
    </label>
    <button class="btn--run" id="inferBtn"><i class="fill" id="runFill"></i><span id="runLabel"><svg width="11" height="11" viewBox="0 0 10 10" fill="currentColor"><path d="M2.6 1.4l6 3.6-6 3.6z"/></svg>開始推理</span></button>
    <span class="step__note" id="viewNote" hidden>純審閱模式，不提供推理</span>
  </div>
</div>

<div class="bar bar--filters">
  <div class="search">
    <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="7" r="4.4"/><path d="M10.4 10.4L14 14"/></svg>
    <input type="text" id="fSearch" placeholder="檔名…">
  </div>
  <div class="seg" id="statusSeg">
    <button data-st="all" class="on">全部<span class="n" id="cAll">0</span></button>
    <button data-st="pending">待推理<span class="n" id="cPending">0</span></button>
    <button data-st="ready">有結果<span class="n" id="cReady">0</span></button>
    <button data-st="approved">已批准<span class="n" id="cApproved">0</span></button>
  </div>
  <div class="popwrap">
    <button class="fbtn" id="labelsBtn" data-pop="labels">標籤<span class="cnt" id="labelsCnt" hidden>0</span>
      <svg class="caret" width="9" height="9" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 3.6L5 6.8l3-3.2"/></svg></button>
    <div class="pop pop--wide" id="pop-labels" hidden>
      <div class="pop__h">選中的判詞或人工段落，命中任一即保留；不選 = 不限</div>
      <div class="popgrid" id="labelOpts"></div>
    </div>
  </div>
  <div class="popwrap">
    <button class="fbtn" id="combosBtn" data-pop="combos">組合<span class="cnt" id="combosCnt">4</span>
      <svg class="caret" width="9" height="9" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 3.6L5 6.8l3-3.2"/></svg></button>
    <div class="pop" id="pop-combos" hidden>
      <div class="pop__h">只比對勾選的組合（至少保留 1 個）</div>
      <div id="comboOpts"></div>
    </div>
  </div>
  <div class="popwrap">
    <button class="fbtn" id="moreBtn" data-pop="more">更多<span class="cnt" id="moreCnt" hidden>0</span>
      <svg class="caret" width="9" height="9" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 3.6L5 6.8l3-3.2"/></svg></button>
    <div class="pop pop--wide" id="pop-more" hidden>
      <div class="poprow"><span>同時命中組合數</span><select id="minN"><option>1</option><option>2</option><option>3</option><option>4</option></select></div>
      <div class="poprow"><span>最小判詞佔比</span>
        <span style="display:flex;align-items:center;gap:6px"><input type="range" id="minShare" min="0" max="90" step="5" value="0"><span class="hint" id="shareVal">關</span></span></div>
      <div class="poprow"><span>來源</span><select id="fSource"><option value="all">全部</option></select></div>
      <div class="poprow"><span>排序</span><select id="sort"><option value="n">命中數 ↓</option><option value="share">判詞佔比 ↓</option><option value="dur">時長 ↓</option><option value="name">檔名</option></select></div>
      <div class="pop__h" id="matchHint" style="border-top:1px solid var(--line);margin-top:6px;padding:7px 4px 0"></div>
    </div>
  </div>
  <span class="spacer"></span>
  <span class="res" id="resTxt"></span>
</div>
<div class="main">
  <div class="list" id="list"></div>
  <div class="detail" id="detail"><div class="empty">← 貼上路徑或點「選擇…」選目錄，點左側影片開始審閱</div></div>
</div>
<div class="statusbar" id="statusbar">
  <span class="sdot"></span>
  <span class="msg" id="statusMsg">已就緒 · 貼上或選擇影片目錄</span>
  <span class="keys"><kbd>空白</kbd>播放 <kbd>Del</kbd>刪除 <kbd>Enter</kbd>批准 <kbd>↑↓</kbd>切換</span>
</div>
<script>
const LC={eating:"var(--eating)",drinking:"var(--drinking)",active:"var(--active)",resting:"var(--resting)",unknown:"var(--unknown)",none:"#77777f",
  grooming:"var(--grooming)",others:"var(--others)",defecating:"var(--defecating)",stand:"var(--stand)"};
const LCN={eating:"eating",drinking:"drinking",active:"active",resting:"resting",unknown:"unknown",none:"none",
  grooming:"grooming",others:"others",defecating:"defecating",stand:"stand"};
const CLASSES=["eating","drinking","active","resting","unknown","grooming","others","defecating","stand"];
// manual-only labels: never produced by VLM inference, human annotators only
const MANUAL_LABELS=["grooming","others","defecating","stand"];
let COMBO_ORDER=["8b-v3","8b-old","32b-v3","32b-old"];
const COMBO_NAMES={"8b-v3":"8B · v3","8b-old":"8B · 舊","32b-v3":"32B · v3","32b-old":"32B · 舊",
  "8b-v1":"8B · v1","8b-v2":"8B · v2","32b-v1":"32B · v1","32b-v2":"32B · v2"};
let SPECIES="rabbit";
let speciesPending=Promise.resolve();
const ST_TXT={pending:"待推理",ready:"有結果",approved:"已批准"};
let DATA=null, curVid=null, DOC=null;
let sel={labels:new Set(),combos:new Set(COMBO_ORDER)};
let shownList=[];
let page=1;
let statusFilter="all";
let SCENE_BOUND=false, INFER_BUSY=false, APPLY_BUSY=false;
const PAGE_SIZE=100;
let E={sel:-1,undo:[],snap:null,curLabel:null,drag:null,anchor:null,scrub:false};

const $=id=>document.getElementById(id);
function esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function fmtDur(s){s=Math.round(s||0);return s>=60?`${Math.floor(s/60)}m${s%60}s`:`${s}s`}
async function api(path,opts){
  const r=await fetch(path,opts);
  const d=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.error||r.statusText);
  return d;
}

/* ---------------- filters (7/8 semantics kept) ---------------- */
function comboHit(c){
  if(!c||!c.dominant) return 0;
  if(sel.labels.size&&!sel.labels.has(c.dominant)) return 0;
  const ms=+$("minShare").value/100;
  if(ms>0&&(c.dominant_share||0)<ms) return 0;
  return 1;
}
function nHits(v){let n=0;for(const cb of sel.combos)n+=comboHit(v.combos[cb]);return n+manualHit(v)}
function manualHit(v){
  if(!sel.labels.size) return 0;
  const labs=v.seg_labels||[];
  for(const l of MANUAL_LABELS) if(sel.labels.has(l)&&labs.includes(l)) return 1;
  return 0;
}
function filtered(){
  const st=statusFilter,src=$("fSource").value,kw=$("fSearch").value.trim().toLowerCase();
  const minN=+$("minN").value,sort=$("sort").value;
  let rows=DATA.videos.map(v=>({v,n:nHits(v)}));
  rows=rows.filter(r=>{
    const v=r.v;
    if(src!=="all"&&v.source!==src) return false;
    if(kw&&!v.rel_path.toLowerCase().includes(kw)) return false;
    if(st==="pending") return v.status==="pending";
    if(v.status==="pending") return false;
    if(st!=="all"&&v.status!==st) return false;
    const avail=[...sel.combos].filter(cb=>v.combos[cb]).length;
    if(avail===0) return false;
    return r.n>=Math.min(minN,avail);
  });
  if(sort==="n") rows.sort((a,b)=>b.n-a.n||(b.v.duration||0)-(a.v.duration||0));
  if(sort==="share") rows.sort((a,b)=>{
    const sa=Math.max(...[...sel.combos].map(cb=>a.v.combos[cb]?.dominant_share||0));
    const sb=Math.max(...[...sel.combos].map(cb=>b.v.combos[cb]?.dominant_share||0));
    return sb-sa;});
  if(sort==="dur") rows.sort((a,b)=>(b.v.duration||0)-(a.v.duration||0));
  if(sort==="name") rows.sort((a,b)=>a.v.rel_path.localeCompare(b.v.rel_path));
  return rows;
}

/* ---------------- list ---------------- */
function renderList(){
  if(!DATA) return;
  const rows=filtered(), minN=+$("minN").value;
  const vs=DATA.videos, tot=vs.length;
  let nPend=0,nReady=0,nAppr=0;
  for(const v of vs){
    if(v.status==="pending")nPend++;
    else if(v.status==="ready")nReady++;
    else if(v.status==="approved")nAppr++;
  }
  const pend=nPend;
  $("cAll").textContent=tot;
  $("cPending").textContent=nPend;
  $("cReady").textContent=nReady;
  $("cApproved").textContent=nAppr;
  $("progFill").style.width=(tot?nAppr/tot*100:0)+"%";
  $("progTxt").innerHTML=`<b>${nAppr}</b> / ${tot} 已批准`;
  $("finishNum").textContent=nAppr;
  $("resTxt").innerHTML=`顯示 <b>${rows.length}</b> / ${tot} 條`;
  $("matchHint").textContent=`規則：勾選組合 ≥ ${Math.min(minN,sel.combos.size)} 個判詞命中；人工段標籤（${MANUAL_LABELS.join("/")}）命中另計 1`;
  shownList=rows.map(r=>r.v.vid);
  const totalPages=Math.max(1,Math.ceil(rows.length/PAGE_SIZE));
  if(page>totalPages) page=totalPages;
  const rowsPage=rows.slice((page-1)*PAGE_SIZE, page*PAGE_SIZE);
  const el=$("list");
  if(!rows.length){
    el.innerHTML=`<div class="empty">${pend?`有 ${pend} 條待推理影片：<br>把狀態切到「待推理」查看，或點「開始推理」`:"當前篩選無命中"}</div>`;
    return;
  }
  const cards=rowsPage.map(r=>{
    const v=r.v;
    const sq=COMBO_ORDER.map(cb=>{
      const c=v.combos[cb];
      if(!c) return `<div class="csq" style="background:#2a2a32;color:var(--tx2)">— 無結果</div>`;
      const hit=comboHit(c);
      const bg=hit?LC[c.dominant]:"#2a2a32";
      const fg=hit?"#111":"var(--tx2)";
      return `<div class="csq" style="background:${bg};color:${fg};${hit?"":"opacity:.55"}">${COMBO_NAMES[cb]} ${LCN[c.dominant]} ${(c.dominant_share*100).toFixed(0)}%</div>`;
    }).join("");
    const thumb=(v.status==="pending")
      ? `<div class="thumb"></div>`
      : `<img loading="lazy" src="/api/frame?vid=${v.vid}&w=w000" onerror="this.style.visibility='hidden'">`;
    return `<div class="card${v.vid===curVid?" sel":""}" data-vid="${v.vid}">
      ${thumb}
      <div class="info">
        <div class="nm" title="${esc(v.rel_path)}">${esc(v.name)}</div>
        <div class="meta">
          <span class="badge st-${v.status}">${ST_TXT[v.status]}</span>
          <span>${fmtDur(v.duration)}</span>
          ${v.n_windows?`<span>${v.n_windows}窗</span>`:""}
          ${v.status!=="pending"?`<span style="color:var(--acc);font-weight:600">命中 ${r.n}</span><span>${v.n_segments}段</span>`:""}
          ${MANUAL_LABELS.filter(l=>sel.labels.has(l)&&(v.seg_labels||[]).includes(l))
            .map(l=>`<span class="csq" style="background:${LC[l]};color:#111">${l}</span>`).join("")}
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:3px">${sq}</div>
      </div></div>`;
  }).join("");
  const pager=`<div class="pager">
    <button data-pg="first" ${page<=1?"disabled":""}>«</button>
    <button data-pg="prev" ${page<=1?"disabled":""}>‹</button>
    <span>第 <input id="pgJump" type="number" min="1" max="${totalPages}" value="${page}"> / ${totalPages} 頁</span>
    <button data-pg="next" ${page>=totalPages?"disabled":""}>›</button>
    <button data-pg="last" ${page>=totalPages?"disabled":""}>»</button>
    <span class="hint">每頁 ${PAGE_SIZE} 條</span>
  </div>`;
  el.innerHTML=cards+pager;
  el.querySelectorAll(".card").forEach(c=>c.onclick=()=>showDetail(c.dataset.vid));
  el.querySelectorAll(".pager button").forEach(b=>b.onclick=()=>{
    const pg=b.dataset.pg;
    if(pg==="first")page=1; else if(pg==="prev")page=Math.max(1,page-1);
    else if(pg==="next")page=Math.min(totalPages,page+1); else page=totalPages;
    renderList(); $("list").scrollTop=0;
  });
  const jump=$("pgJump");
  if(jump) jump.onchange=()=>{
    page=Math.max(1,Math.min(totalPages,+jump.value||1));
    renderList(); $("list").scrollTop=0;
  };
}

/* ---------------- detail ---------------- */
async function showDetail(vid,reveal=true){
  curVid=vid;
  const idx=shownList.indexOf(vid);
  if(reveal&&idx>=0) page=Math.floor(idx/PAGE_SIZE)+1;
  E={sel:-1,undo:[],snap:null,curLabel:null,drag:null,anchor:null,scrub:false};
  renderList();
  const el=$("detail");
  el.innerHTML='<div class="empty">載入中…</div>';
  try{ DOC=await api("/api/doc?vid="+vid); }
  catch(e){ DOC=null; }
  renderDetail();
}
function comboBandsHtml(doc){
  return COMBO_ORDER.map(cb=>{
    const c=(doc.combos||{})[cb];
    if(!c||!c.windows||!c.windows.length)
      return `<div class="tl"><div class="tl-name"><span>${COMBO_NAMES[cb]}</span><span>無結果</span></div><div class="band"></div></div>`;
    const dur=doc.duration||1;
    const segs=c.windows.map(r=>{
      const x0=(r.start/dur*100).toFixed(2), x1=(Math.min(r.end,dur)/dur*100).toFixed(2);
      const col=LC[r.label]||"#555";
      const op=r.label==="none"?0.9:Math.max(.35,Math.min(1,.4+(r.confidence||0)*.6));
      const txt=r.end-r.start>2.5?LCN[r.label]:"";
      return `<div class="segro" style="left:${x0}%;width:${Math.max(0.15,x1-x0)}%;background:${col};opacity:${op}" data-t="${r.start}" title="${COMBO_NAMES[cb]} · ${r.w} · ${r.label} ${(r.confidence||0).toFixed(2)} · gate=${r.gate}"><span>${txt}</span></div>`;
    }).join("");
    const dist=c.dist?Object.entries(c.dist).map(([k,n])=>`${k} ${n}`).join(" · "):"";
    return `<div class="tl"><div class="tl-name"><span><span class="sw" style="background:${LC[c.dominant]}"></span>${COMBO_NAMES[cb]} — 主導 <b style="color:${LC[c.dominant]}">${LCN[c.dominant]}</b> ${(c.dominant_share*100).toFixed(0)}%</span><span class="hint">${dist}</span></div><div class="band">${segs}</div></div>`;
  }).join("");
}
function renderDetail(){
  const el=$("detail");
  if(!curVid){el.innerHTML='<div class="empty">← 選擇左側影片查看詳情</div>';return}
  const v=DATA&&DATA.videos.find(x=>x.vid===curVid);
  if(!DOC){
    el.innerHTML=`<h2>${esc(v?v.name:curVid)}</h2>
      <div class="sub"><span class="badge st-pending">待推理</span>${v?`<span>${fmtDur(v.duration)}</span>`:""}</div>
      <video id="pv" controls preload="metadata" src="/api/video?vid=${curVid}"></video>
      <div class="empty">該影片尚未推理：點「開始推理」；<br>推理完成後這裡會出現可編輯的預標註段時間軸。</div>`;
    return;
  }
  const doc=DOC;
  const st=doc.approved?"approved":"ready";
  const meta=[fmtDur(doc.duration),`${doc.n_gate_none} 窗無${SPECIES==="rabbit"?"兔":"貓狗"}(YOLO)`,
    `${Object.keys(doc.combos||{}).length} 組合`,esc(doc.rel_path)].join(" · ");
  const baseCb=COMBO_ORDER.find(cb=>(doc.combos||{})[cb]&&(doc.combos[cb].windows||[]).length);
  const plan=baseCb?doc.combos[baseCb].windows:[];
  const rowsHtml=plan.map((r0,i)=>{
    const cells=COMBO_ORDER.map(cb=>{
      const c=(doc.combos||{})[cb];
      const r=c&&c.windows&&c.windows[i];
      if(!r) return "<td>—</td>";
      return `<td><span class="dom" style="background:${LC[r.label]}">${LCN[r.label]}</span> ${(r.confidence||0).toFixed(2)}</td>`;
    }).join("");
    return `<tr class="wrow" data-t="${r0.start}" style="cursor:pointer"><td>${r0.w}</td><td>${r0.start.toFixed(1)}–${r0.end.toFixed(1)}s</td><td>${r0.gate==="vlm"?"✓":"✗"}</td>${cells}</tr>`;
  }).join("");
  el.innerHTML=`<h2>${esc(doc.rel_path)}</h2>
    <div class="sub">
      <span class="badge st-${st}">${ST_TXT[st]}</span><span>${meta}</span>
      <span id="editStatus"></span>
      <span style="flex:1"></span>
      <button id="resynBtn" title="用當前組合的視窗結果按多數票重新合成預標註段（覆蓋現有段）">重新合成</button>
      <button id="approveBtn" class="primary" title="Enter">批准此影片</button>
    </div>
    <video id="pv" controls preload="metadata" src="/api/video?vid=${curVid}"></video>
    <div class="tl">
      <div class="tl-name">
        <span>合成段（可編輯 · <kbd>拖兩端</kbd>修剪 · <kbd>空白拖</kbd>新增 · <kbd>Del</kbd>刪除 · <kbd>Ctrl+Z</kbd>復原）</span>
        <span id="segCount"></span>
      </div>
      <div id="etl"><div id="ecursor" style="left:0"></div></div>
      <div id="legend"></div>
    </div>
    ${comboBandsHtml(doc)}
    <table><thead><tr><th>視窗</th><th>時間</th><th style="width:46px">兔?</th>${COMBO_ORDER.map(cb=>`<th>${COMBO_NAMES[cb]}</th>`).join("")}</tr></thead><tbody>${rowsHtml}</tbody></table>
    <div class="statscard" id="statsCard"></div>`;
  renderETL(); renderLegend(); renderStatsCard(); bindDetail();
}
function renderStatsCard(){
  const el=$("statsCard"); if(!el||!DATA||!DATA.stats) return;
  const s=DATA.stats;
  const classes=s.class_names&&s.class_names.length?s.class_names:Object.keys(s.labels);
  let totalMin=0,maxMin=0;
  const rows=classes.map(c=>{const m=((s.labels[c]||{}).duration||0)/60;totalMin+=m;maxMin=Math.max(maxMin,m);return{c,m}});
  el.innerHTML=`<div class="head">已批准資料集 · ${s.approved_videos}/${s.total_videos} 影片 · ${totalMin.toFixed(1)} 分鐘</div>`+
    (classes.length?rows.map(({c,m})=>`<div class="row"><span>${c}</span><div class="track"><div class="fill" style="width:${maxMin>0?m/maxMin*100:0}%;background:${LC[c]}"></div></div><span style="color:var(--tx2);font-size:11px;text-align:right">${m.toFixed(1)} min</span></div>`).join("")
    :'<div class="hint">還沒有已批准的影片。</div>');
}

/* ---------------- editor (2b interaction set) ---------------- */
function timeAtX(clientX){
  const rect=$("etl").getBoundingClientRect();
  return Math.max(0,Math.min(DOC.duration||1,(clientX-rect.left)/rect.width*(DOC.duration||1)));
}
function snapNow(){return JSON.stringify(DOC.segments)}
function pushUndo(s){E.undo.push(s);if(E.undo.length>50)E.undo.shift()}
function colorOf(label){return LC[label]||"#e63946"}
async function undo(){
  if(!DOC)return;
  if(!E.undo.length){$("editStatus").textContent="沒有可復原的操作";return}
  DOC.segments=JSON.parse(E.undo.pop());
  E.sel=-1;
  await saveDoc("save");
  $("editStatus").textContent="已復原（批准已清除，請重新批准）";
}
function renderETL(){
  const tl=$("etl"); if(!tl||!DOC) return;
  tl.innerHTML="<div id='ecursor' style='left:0'></div>";
  const D=DOC.duration||1;
  DOC.segments.forEach((s,i)=>{
    const el=document.createElement("div");
    el.className="seg"+(i===E.sel?" selected":"");
    el.style.left=(s.start/D*100)+"%";
    el.style.width=Math.max(0,(s.end-s.start)/D*100)+"%";
    el.style.background=colorOf(s.label);
    el.title=`${s.label} ${s.start.toFixed(1)}–${s.end.toFixed(1)}s conf=${(s.confidence||0).toFixed(2)}`;
    el.textContent=`${s.label} ${(s.confidence??0).toFixed(2)}`;
    el.innerHTML+="<div class='handle l'></div><div class='handle r'></div>";
    el.onmousedown=e=>{
      if(e.target.classList.contains("handle")){
        E.snap=snapNow();
        E.drag={idx:i,side:e.target.classList.contains("l")?"l":"r"};
      }else{
        E.sel=i; E.curLabel=s.label;
        const pv=$("pv"); if(pv)pv.currentTime=s.start;
        renderETL(); markChips();
      }
      e.preventDefault();
    };
    tl.appendChild(el);
  });
  $("segCount").textContent=`${DOC.segments.length} 段`;
}
function bindDetail(){
  const tl=$("etl"), pv=$("pv");
  tl.onmousedown=e=>{
    if(e.target!==tl)return;
    E.anchor={x:e.clientX,t:timeAtX(e.clientX)};
    e.preventDefault();
  };
  window.onmousemove=e=>{
    if(E.scrub){pv.currentTime=timeAtX(e.clientX);return}
    if(E.anchor&&!E.drag&&Math.abs(e.clientX-E.anchor.x)>4){
      E.snap=snapNow();
      DOC.segments.push({start:E.anchor.t,end:E.anchor.t,
        label:E.curLabel||CLASSES[0]||"unknown",
        confidence:1.0,source:"human"});
      E.sel=DOC.segments.length-1;
      E.drag={idx:E.sel,side:"create",anchor:E.anchor.t};
      E.anchor=null;
    }
    if(!E.drag)return;
    const t=timeAtX(e.clientX);
    const s=DOC.segments[E.drag.idx];
    if(E.drag.side==="create"){s.start=Math.min(E.drag.anchor,t);s.end=Math.max(E.drag.anchor,t)}
    else if(E.drag.side==="l")s.start=Math.min(t,s.end-0.2);
    else s.end=Math.max(t,s.start+0.2);
    s.source="human";
    pv.currentTime=t;
    renderETL();
  };
  window.onmouseup=async()=>{
    if(E.scrub){E.scrub=false;return}
    if(E.anchor){
      pv.currentTime=E.anchor.t;
      E.anchor=null;
      return;
    }
    if(!E.drag)return;
    const wasCreate=E.drag.side==="create";
    E.drag=null;
    if(wasCreate){
      const s=DOC.segments[DOC.segments.length-1];
      if(s.end-s.start<0.2){DOC.segments.pop();E.sel=-1;E.snap=null;renderETL();return}
    }
    if(E.snap){pushUndo(E.snap);E.snap=null}
    await saveDoc("save");
  };
  pv.ontimeupdate=()=>{
    const D=(DOC&&DOC.duration)||1;
    const cur=$("ecursor");
    if(cur)cur.style.left=(pv.currentTime/D*100)+"%";
  };
  const el=$("detail");
  el.querySelectorAll(".segro,.wrow").forEach(s=>s.onclick=()=>{
    const p=$("pv");
    if(p){p.currentTime=+s.dataset.t+0.05;p.play().catch(()=>{})}
  });
  $("approveBtn").onclick=()=>approveVideo();
  $("resynBtn").onclick=()=>resynthesize();
  window.onresize=()=>{if(DOC&&$("etl"))renderETL()};
}
function renderLegend(){
  const lg=$("legend"); lg.innerHTML="";

  for(const c of CLASSES){
    const chip=document.createElement("span");
    chip.className="lchip";
    chip.style.background=colorOf(c);
    chip.dataset.label=c;

    chip.onclick=()=>pickLabel(c);

  const gap=document.createElement("span");
  gap.className="lchip gap";gap.textContent=`空隙 = 無段（無${SPECIES==="rabbit"?"兔":"貓狗"} / 投票不達標）`;

function markChips(){

async function pickLabel(c){

async function resynthesize(){

/* ---------------- keyboard ---------------- */
window.onkeydown=e=>{
  const t=e.target||document.body;
  const tag=(t.tagName||"").toUpperCase();
  if(tag==="INPUT"||tag==="SELECT"||tag==="TEXTAREA"||t.isContentEditable)return;
  // 焦點在按鈕/連結上時交還給瀏覽器：否則 Enter 會誤批准當前影片、空白鍵會誤切播放
  if(t.closest&&t.closest("button,a,[role=button],summary"))return;
  if(e.code==="Space"){e.preventDefault();const pv=$("pv");if(pv&&pv.src)pv.paused?pv.play():pv.pause()}
  else if(e.ctrlKey&&e.key.toLowerCase()==="z"){e.preventDefault();undo()}
  else if(e.key==="Enter"){e.preventDefault();approveVideo()}
  else if(e.key==="Backspace"||e.key==="Delete"){e.preventDefault();deleteSelected()}
  else if(e.key==="ArrowDown"||e.key==="ArrowUp"){
    e.preventDefault();
    if(!shownList.length)return;
    const cur=shownList.indexOf(curVid);
    let next;
    if(e.key==="ArrowDown")next=cur<0?0:Math.min(cur+1,shownList.length-1);
    else next=cur<0?0:Math.max(cur-1,0);
    if(shownList[next]&&shownList[next]!==curVid)showDetail(shownList[next]);
  }
};

let inferTimer=null;
function setRunState(running,done,total){
  const btn=$("inferBtn"),label=$("runLabel");
  if(running){
    btn.classList.add("is-run");
    label.textContent=total?`推理中 ${done} / ${total}`:"推理中…";
    $("runFill").style.width=(total?done/total*100:0)+"%";
  }else{
    btn.classList.remove("is-run");
    label.innerHTML=`<svg width="11" height="11" viewBox="0 0 10 10" fill="currentColor"><path d="M2.6 1.4l6 3.6-6 3.6z"/></svg>開始推理`;
    $("runFill").style.width="0";
  }

function pollInfer(){
  if(inferTimer)return;
  INFER_BUSY=true; refreshBusy(); setRunState(true,0,0);
  inferTimer=setInterval(async()=>{
    let s;
    try{s=await (await fetch("/api/infer/status")).json()}catch(e){return}
    if(s.running){
      setRunState(true,s.done||0,s.total||0);
      say(`推理中 ${s.done}/${s.total}${s.current?" · "+s.current:""}`,"busy");
      return;
    }
    clearInterval(inferTimer);inferTimer=null;
    INFER_BUSY=false; refreshBusy(); setRunState(false);
    if(s.error){ say("推理出錯: "+s.error,"err"); return; }
    if(s.done>0||s.total>0){
      say(`推理完成 · ${s.done}/${s.total} 條`);
      loadList();
      if(curVid)showDetail(curVid,false);
    }else say("推理結束");
  },2000);
}

  let n=0;
  if(+$("minN").value>1)n++;
  if(+$("minShare").value>0)n++;
  if($("fSource").value!=="all")n++;
  if($("sort").value!=="n")n++;
  $("moreCnt").hidden=!n;
  $("moreCnt").textContent=n;
  $("moreBtn").classList.toggle("is-on",!!n);
}
$("minN").onchange=()=>{page=1;updateMoreBadge();renderList()};
$("minShare").oninput=()=>{
  const v=+$("minShare").value;
  $("shareVal").textContent=v===0?"關":`≥ ${v}%`;
  page=1; updateMoreBadge(); renderList();
};
$("fSource").onchange=()=>{page=1;updateMoreBadge();renderList()};
$("fSearch").oninput=()=>{page=1;renderList()};
$("sort").onchange=()=>{page=1;updateMoreBadge();renderList()};

/* ---------------- boot ---------------- */
function renderSourceOptions(){
  if(!DATA)return;
  const srcs=[...new Set(DATA.videos.map(v=>v.source))].sort();
  const cur=$("fSource").value;
  $("fSource").innerHTML='<option value="all">全部</option>'+
    srcs.map(s=>`<option value="${esc(s)}"${s===cur?" selected":""}>${esc(s)}</option>`).join("");
}
async function loadList(){
  try{
    DATA=await api("/api/data");
  }catch(e){
    return;
  }
  renderSourceOptions();
  renderList();
  renderStatsCard();
}
(async function boot(){
  renderLabelOpts();
  document.querySelectorAll("#speciesSeg button").forEach(b=>b.onclick=()=>{
    if(b.dataset.sp===SPECIES)return;
    markSpecies(b.dataset.sp);
    changeSpecies(b.dataset.sp);
  });
  renderStaticCombos();
  try{
    const st=await api("/api/state");
    applySpecies(st.species||"rabbit");
    $("sceneList").innerHTML=(st.scenes||[]).map(s=>`<option value="${esc(s)}">`).join("");
    if(st.scene)setScene(st.scene,true);
    if(st.no_infer){
      $("modePill").className="pill pill--view";
      $("modeText").textContent="純審閱模式";
      $("inferCombos").style.display="none";
      $("cropWrap").style.display="none";
      $("inferBtn").style.display="none";
      $("viewNote").hidden=false;
    }
    if(st.target)setPath(st.target,true);
    else if(st.suggested_dir)setPath(st.suggested_dir,false);
    if(st.infer&&st.infer.running)pollInfer();
  }catch(e){}
  await loadList();
  if(DATA&&DATA.videos.length)showDetail(DATA.videos[0].vid);
})();
</script>
</body>
</html>
